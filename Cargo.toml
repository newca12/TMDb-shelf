[package]
name = "tmdb-shelf"
version = "0.1.4"
authors = ["Olivier ROLAND <newca12@users.noreply.github.com>"]
description = "Movie collection manager using TMDb API, built with Iced."
homepage = "https://github.com/newca12/TMDb-shelf"
repository = "https://github.com/newca12/TMDb-shelf.git"
keywords = ["gui", "tmdb", "movie", "imdb"]
categories = ["gui"]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99.1"


[dependencies]
iced = { version = "0.14.0", features = ["tokio", "image"] }
iced_aw = { version = "0.14.1", features = ["date_picker"] }
tokio = { version = "1.54.1", features = ["process", "fs"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
libsql = "0.10.0"
chrono = { version = "0.4.45", features = ["serde"] }
rfd = "0.18.0"
open = "5.4.5"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
